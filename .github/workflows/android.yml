# Baut die Android-App (APK) automatisch bei GitHub – ohne Android Studio auf dem eigenen PC.
# Start: im GitHub-Repository unter „Actions“ → „Android-App bauen“ → „Run workflow“.
# Ergebnis: unter dem Lauf bei „Artifacts“ die Datei Manaschmiede-APK herunterladen.
name: Android-App bauen

on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.CDB_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: APK bauen (Debug, sofort installierbar)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Signierte Release-APK bauen (nur wenn Schlüssel hinterlegt)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          CDB_KEYSTORE_PASSWORD: ${{ secrets.CDB_KEYSTORE_PASSWORD }}
          CDB_KEY_ALIAS: ${{ secrets.CDB_KEY_ALIAS }}
          CDB_KEY_PASSWORD: ${{ secrets.CDB_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.CDB_KEYSTORE_BASE64 }}" | base64 -d > release.jks
          CDB_KEYSTORE=$PWD/release.jks ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: Manaschmiede-APK
          path: android/app/build/outputs/apk/**/*.apk
