plugins {
    id "com.android.application"
}

android {
    namespace "de.commanderdb.app"
    compileSdk 34

    defaultConfig {
        applicationId "de.commanderdb.app"
        minSdk 24
        targetSdk 34
        versionCode 59
        versionName "59"
    }

    // Optional signierte Release-Version: Schlüssel über Umgebungsvariablen (siehe README-Android.md)
    signingConfigs {
        release {
            def ks = System.getenv("CDB_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("CDB_KEYSTORE_PASSWORD")
                keyAlias System.getenv("CDB_KEY_ALIAS")
                keyPassword System.getenv("CDB_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("CDB_KEYSTORE")) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Gleicht Kotlin-Bibliotheken der Abhängigkeiten auf eine Version an (sonst „Duplicate class kotlin…“)
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    // Texterkennung direkt auf dem Gerät (ohne Internet, kostenlos): Google ML Kit, lateinische Schrift
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // FileProvider für das Kamerafoto
    implementation "androidx.core:core:1.13.1"
    // Dauerscan: eigene Kameraansicht mit laufender Bildanalyse
    implementation "androidx.activity:activity:1.8.2"
    def camerax = "1.3.4"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
}
